# Builds the single-file game and publishes it to GitHub Pages on every push to main.
# The game is served at the site root, its music beside it, and the bestiary at /bestiary.html.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          node tools/build.js --game
          node tools/build.js
          mkdir -p _site
          cp dist/brindlemere.html _site/index.html
          cp -r dist/music _site/music
          cp dist/bestiary.html _site/bestiary.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
